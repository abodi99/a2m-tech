<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Central hub -->
  <circle cx="32" cy="32" r="8" fill="#003347"/>
  <!-- 4 spokes -->
  <line x1="32" y1="24" x2="32" y2="8"  stroke="#003347" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="56" stroke="#003347" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="32" x2="8"  y2="32" stroke="#003347" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="32" x2="56" y2="32" stroke="#003347" stroke-width="3" stroke-linecap="round"/>
  <!-- Endpoint nodes -->
  <circle cx="32" cy="8"  r="4" fill="#003347"/>
  <circle cx="32" cy="56" r="4" fill="#003347"/>
  <circle cx="8"  cy="32" r="4" fill="#003347"/>
  <circle cx="56" cy="32" r="4" fill="#003347"/>
</svg>
